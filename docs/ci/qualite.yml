name: Qualité et sécurité

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

# Moindre privilège : le jeton GitHub du workflow est en lecture seule.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - name: Build (export statique)
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: demo
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-ynov-rh.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-ynov-rh
          NEXT_PUBLIC_FIREBASE_APP_ID: demo

  api:
    name: API (types, tests unitaires, intégration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - name: Tests unitaires (règles de solde et d'autorisation)
        run: npm test
      - name: Tests d'intégration (scénarios du cahier des charges, émulateurs)
        run: |
          npm install -g firebase-tools --ignore-scripts
          npm run test:integration

  securite:
    name: Analyse de sécurité (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: "p/default"
